    font-style: normal;
    font-display: swap;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; }
  #map { height: 100vh; width: 100%; }

  .back-to-main {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 1000;
    background: #ffffff;
    border: 2px solid rgba(0,0,0,0.15);
    border-radius: 10px;
    padding: 10px 18px;
    font-family: 'MyFont', 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 0.5px;
    color: #006f97;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
  }
  .back-to-main:hover { background: #f5f9fb; transform: translateY(-1px); }

  #details-panel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    z-index: 9999;
    overflow-y: auto;
    padding: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
  }
  #details-panel .close-btn {
    background: #e74c3c;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 18px;
    border-radius: 5px;
    cursor: pointer;
    margin-bottom: 20px;
  }
  #details-panel .close-btn:hover { background: #c0392b; }
  #details-panel h1 { font-size: 28px; margin-bottom: 10px; }
  #details-panel .description {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 10px;
    white-space: pre-line;
  }
  #details-panel .authority {
    font-size: 18px;
    margin-bottom: 15px;
    color: #2c3e50;
    background: #ecf0f1;
    padding: 8px 12px;
    border-radius: 5px;
    display: inline-block;
  }
  #details-panel .photos { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
  #details-panel .photo-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 200px;
  }
  #details-panel .photo-item img {
    width: 100%;
    height: auto;
    max-height: 150px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.2s;
  }
  #details-panel .photo-item img:hover { transform: scale(1.05); }
  #details-panel .photo-item .label {
    margin-top: 5px;
    font-size: 14px;
    color: #555;
    font-weight: bold;
    text-align: center;
  }
  #details-panel .photo-item .label-missing {
    margin-top: 5px;
    font-size: 14px;
    color: #999;
    font-style: italic;
    text-align: center;
  }
  .status-badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    margin-top: 10px;
  }
  .status-completed { background: #27ae60; }
  .status-in-progress { background: #f39c12; }
  .status-not-sent { background: #95a5a6; }

  #lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 10000;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  #lightbox img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(255,255,255,0.3);
  }
  #lightbox .close-lightbox {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
  }
  #lightbox .close-lightbox:hover { color: #ccc; }

  .nav-btn {
    position: absolute;
    bottom: 30px;
    right: 30px;
    z-index: 1000;
    background: white;
    border: 2px solid rgba(0,0,0,0.2);
    border-radius: 5px;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    display: none;
    transition: 0.2s;
  }
  .nav-btn:hover { background: #f0f0f0; }
  .nav-btn.show { display: block; }
  #btn-to-poyarkovo { bottom: 90px; }

  .linked-btn {
    display: inline-block;
    background: #2980b9;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-right: 10px;
    margin-top: 10px;
    transition: 0.2s;
  }
  .linked-btn:hover { background: #1f618d; }
  .linked-section { margin-top: 20px; }

  @media (max-width: 600px) {
    .back-to-main { font-size: 15px; padding: 8px 14px; top: 10px; left: 10px; }

  // ===================== СВЯЗАННЫЕ ОБРАЩЕНИЯ =====================
  var linkedComplaints = [
    {
      id: 101,
      title: "СВЯЗАННОЕ ОБРАЩЕНИЕ Роскомнадзор",
      authority: "Управление Федеральной службы по надзору в сфере связи, информационных технологий и массовых коммуникаций по Амурской области\n(Управление Роскомнадзора по Амурской области)",
      description: "Мои ФИО и почта оказались в одном файле-ответе с данными третьего лица, и этот файл получил не только я, но и третье лицо, получается, он узнал мои персональные данные без моего согласия, что прямо запрещено законом о персональных данных (152-ФЗ).\n\nP. S. Роскомнадзор обязал администрацию провести разъяснительную беседу с сотрудниками. Разъяснительная беседа с сотрудниками администрации проведена.",
      status: "completed",
      photos: [
        { url: "https://i.pinimg.com/736x/d5/91/e4/d591e436f177b0617138bba0bdedaae9.jpg", localUrl: "img/points/id4_otvet.jpg", label: "Ответ, на который написана жб" },
        { url: "https://i.pinimg.com/736x/cc/20/54/cc2054c1483ee31fab3a3ac5c80c7d9e.jpg", localUrl: "img/points/id101_otvet_rkn.jpg", label: "Ответ Роскомнадзора" }
      ]
    },
    {
      id: 102,
      title: "СВЯЗАННОЕ ОБРАЩЕНИЕ Прокуратура",
      authority: "Прокуратура города Благовещенска",
      description: "Нарушения со стороны администрации в ответе:\n• Нет ответа по существу поставленных вопросов, а так же отсутствуют ответы на них\n• Объединение моего обращения (по поводу вывесок OZON) с обращением третьего лица (по поводу блоков кондиционеров), хотя темы не связаны между собой.\n• В ответе указано что вывески демонтированы (во мн. ч.) хотя по факту демонтирована лишь одна.\n\n• Прокуратура, проведя проверку, признала, что ответ администрации содержит неполную и недостоверную информацию. В адрес заместителя мэра вынесено представление — он обязан устранить нарушение.\n• Администрация направила новый ответ, после представления прокуратуры.",
      status: "completed",
      photos: [
        { url: "https://i.pinimg.com/736x/d5/91/e4/d591e436f177b0617138bba0bdedaae9.jpg", localUrl: "img/points/id4_otvet.jpg", label: "Ответ, на который написана жб" },
        { url: "https://i.pinimg.com/736x/02/db/08/02db08ccdc4b896bcce83fb687794f02.jpg", localUrl: "img/points/id102_otvet_prokuratura.jpg", label: "Ответ прокуратуры" },
        { url: "https://i.pinimg.com/736x/c3/f7/04/c3f7041149a60d3c684af90af7671d82.jpg", localUrl: "img/points/id102_otchet.jpg", label: "Отчёт рассмотрения представления" }
      ]
    }

  // ===================== КАРТА =====================
  var map = L.map('map').setView([50.27, 127.55], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  function getIcon(status) {
    var iconUrl;
    if (status === 'completed') {
      iconUrl = 'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-green.png';
    } else if (status === 'not-sent') {
      iconUrl = 'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-grey.png';
    } else {
      iconUrl = 'https://cdn.jsdelivr.net/gh/pointhi/leaflet-color-markers@master/img/marker-icon-orange.png';
    }
    return L.icon({
      iconUrl: iconUrl,
      shadowUrl: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41]
    });
  }

  var markers = L.markerClusterGroup({
    maxClusterRadius: 15,
    zoomToBoundsOnClick: true,
    spiderfyOnMaxZoom: false,
    showCoverageOnHover: false
  });

  var historyStack = [];

  function getLinkedComplaintById(id) {
    return linkedComplaints.find(function(item) { return item.id === id; });
  }

  // ФУНКЦИЯ ВЫБОРА ИСТОЧНИКА ФОТО
  function getPhotoUrl(item) {
    var src = localStorage.getItem('photoSource') || 'pinterest';
    if (src === 'local' && item.localUrl) return item.localUrl;
    if (item.url) return item.url;
    return item.localUrl || '';
  }

  function renderDetails(data) {
    document.getElementById('detail-title').innerText = data.title;
    document.getElementById('detail-description').innerText = data.description;

    var authorityContainer = document.getElementById('detail-authority');
    if (data.authority && data.authority.length > 0) {
      authorityContainer.innerText = '🏛️ Рассмотрел: ' + data.authority;
      authorityContainer.style.display = 'inline-block';
    } else {
      authorityContainer.style.display = 'none';
    }

    var photosContainer = document.getElementById('detail-photos');
    photosContainer.innerHTML = '';
    if (data.photos && data.photos.length > 0) {
      data.photos.forEach(function(item) {
        var div = document.createElement('div');
        div.className = 'photo-item';

        if (item.url || item.localUrl) {
          var img = document.createElement('img');
          img.src = getPhotoUrl(item);
          img.alt = item.label;
          img.onclick = function(e) {
            e.stopPropagation();
            openLightbox(getPhotoUrl(item));
          };
          div.appendChild(img);
        } else if (item.missing) {
          var placeholder = document.createElement('div');
          placeholder.style.cssText = 'width:100%;height:100px;background:#f5f5f5;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:#999;font-style:italic;';
          placeholder.innerText = item.text || 'Фото отсутствует';
          div.appendChild(placeholder);
        }

        var label = document.createElement('div');
        label.className = item.missing ? 'label-missing' : 'label';
        label.innerText = item.label || '';
        div.appendChild(label);

        photosContainer.appendChild(div);
      });
    } else {
      photosContainer.innerHTML = '<p>Фотографии отсутствуют</p>';
    }

    var statusContainer = document.getElementById('detail-status');
    statusContainer.innerHTML = '';
    var badge = document.createElement('span');
    badge.className = 'status-badge ';
    if (data.status === 'completed') {
      badge.classList.add('status-completed');
      badge.innerText = '✅ Завершено';
    } else if (data.status === 'not-sent') {
      badge.classList.add('status-not-sent');
      badge.innerText = '⏳ Не отправлено';
    } else {
      badge.classList.add('status-in-progress');
      badge.innerText = '🟠 В процессе';
    }
    statusContainer.appendChild(badge);

    var linkedSection = document.getElementById('linked-section');
    linkedSection.innerHTML = '';
    if (data.linkedIds && data.linkedIds.length > 0) {
      var title = document.createElement('div');
      title.style.fontWeight = 'bold';
      title.style.marginBottom = '10px';
      title.innerText = 'Связанные обращения:';
      linkedSection.appendChild(title);

      data.linkedIds.forEach(function(id) {
        var linked = getLinkedComplaintById(id);
        if (linked) {
          var btn = document.createElement('button');
          btn.className = 'linked-btn';
          if (id === 101) btn.innerText = 'СВЯЗАННОЕ ОБРАЩЕНИЕ Роскомнадзор';
          else if (id === 102) btn.innerText = 'СВЯЗАННОЕ ОБРАЩЕНИЕ Прокуратура';
          else btn.innerText = linked.title;
          btn.onclick = function() { openPanel(linked, true); };
          linkedSection.appendChild(btn);
        }
      });
    }

    var backBtn = document.getElementById('back-btn');
    backBtn.innerText = (historyStack.length > 1) ? '⬅ Назад' : '✕ Закрыть';

    document.getElementById('details-panel').style.display = 'block';
    document.body.style.overflow = 'hidden';
  }

  function openPanel(data, pushHistory) {
    if (pushHistory) {
      if (historyStack.length === 0 || historyStack[historyStack.length-1].id !== data.id) {
        historyStack.push(data);
      }
    }
    renderDetails(data);
  }

  function goBack() {
    if (historyStack.length > 1) {
      historyStack.pop();
      renderDetails(historyStack[historyStack.length-1]);
    } else {
      closePanel();
    }
  }

  function closePanel() {
    document.getElementById('details-panel').style.display = 'none';
    document.body.style.overflow = 'auto';
    historyStack = [];
  }

  function openLightbox(imgSrc) {
    document.getElementById('lightbox-img').src = imgSrc;
    document.getElementById('lightbox').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.body.style.overflow = 'auto';
  }

  violations.forEach(function(item) {
    var marker = L.marker([item.lat, item.lng], { icon: getIcon(item.status), status: item.status });

    // Точка 2 (военкомат) отображается, но не реагирует на клик
    if (item.id !== 2) {
      marker.on('click', function() {
        historyStack = [];
        openPanel(item, true);
      });
    }

    markers.addLayer(marker);
  });

  map.addLayer(markers);

  var defaultCenter = [50.27, 127.55];
  var defaultZoom = 14;
  var poyarkovoCenter = [49.621612, 128.631080];
  var poyarkovoZoom = 17;

  var btnToPoyarkovo = document.getElementById('btn-to-poyarkovo');
  var btnBack = document.getElementById('btn-back');

  function flyToPoyarkovo() {
    map.flyTo(poyarkovoCenter, poyarkovoZoom, { duration: 1.5 });
    btnToPoyarkovo.classList.remove('show');
    btnBack.classList.add('show');
  }

  function flyBack() {
    map.flyTo(defaultCenter, defaultZoom, { duration: 1.5 });
    btnBack.classList.remove('show');
    setTimeout(function() {
      var center = map.getCenter();
      var dist = map.distance(center, L.latLng(defaultCenter));
      if (dist > 5000) {
        btnToPoyarkovo.classList.add('show');
      }
    }, 2000);
  }

  btnToPoyarkovo.addEventListener('click', flyToPoyarkovo);
  btnBack.addEventListener('click', flyBack);

  map.on('moveend', function() {
    var center = map.getCenter();
    var distFromDefault = map.distance(center, L.latLng(defaultCenter));
    var distFromPoyarkovo = map.distance(center, L.latLng(poyarkovoCenter));

    if (distFromPoyarkovo < 1000 && !btnBack.classList.contains('show')) {
      btnBack.classList.add('show');
      btnToPoyarkovo.classList.remove('show');
    } else if (distFromDefault < 5000 && btnBack.classList.contains('show')) {
      btnBack.classList.remove('show');
      btnToPoyarkovo.classList.remove('show');
    } else if (distFromDefault > 5000 && !btnBack.classList.contains('show')) {
      btnToPoyarkovo.classList.add('show');
    }
  });

  console.log('Карта готова! Всего точек: ' + violations.length);
</script>
